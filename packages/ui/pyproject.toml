[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-autonomo-taxes-ui"
version = "0.1.0"
description = "Optional browser interface for the Spain autonomo accounting toolkit."
requires-python = ">=3.11"
dependencies = ["spain-autonomo-taxes==0.1.0"]

[project.scripts]
autonomo-web = "autonomo_taxes_ui.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomo_taxes_ui = ["dist/index.html", "dist/build-manifest.json", "dist/ui-assets/*.js", "dist/ui-assets/*.css"]
