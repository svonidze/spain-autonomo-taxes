[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-autonomo-taxes"
version = "0.1.0"
description = "SQLite-backed accounting and tax preparation toolkit for a Spanish autonomo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "pypdf>=5",
  "PyYAML>=6",
]

[project.scripts]
autonomo-tax = "autonomo_taxes.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["autonomo_taxes.web_ui*"]

[tool.autonomo.web-ui]
build-contract = 2

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["web: optional web adapter, assets, or browser integration"]
