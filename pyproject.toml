[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-autonomo-taxes"
version = "0.1.0"
description = "SQLite-backed accounting and tax preparation toolkit for a Spanish autonomo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
  "PyYAML>=6",
]

[project.scripts]
autonomo-tax = "autonomo_taxes.cli:main"
autonomo-web = "autonomo_taxes.local_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomo_taxes = ["web_ui/*.html", "web_ui/*.css", "web_ui/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
