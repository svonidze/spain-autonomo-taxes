<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учет autónomo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>
        <strong>Autónomo</strong>
        <small data-i18n="brand.subtitle">Бухгалтерия в Испании</small>
      </span>
    </div>

    <nav class="primary-nav" aria-label="Основная навигация" data-i18n-aria="nav.aria">
      <button class="nav-item active" data-view="dashboard"><span aria-hidden="true">▦</span><span data-i18n="nav.dashboard">Обзор</span></button>
      <button class="nav-item" data-view="income"><span aria-hidden="true">↗</span><span data-i18n="nav.income">Доходы</span></button>
      <button class="nav-item" data-view="expenses"><span aria-hidden="true">↙</span><span data-i18n="nav.expenses">Расходы</span></button>
      <button class="nav-item" data-view="review"><span aria-hidden="true">✓</span><span data-i18n="nav.review">Проверка</span></button>
      <button class="nav-item" data-view="assets"><span aria-hidden="true">◇</span><span data-i18n="nav.assets">Активы</span></button>
      <button class="nav-item" data-view="taxes"><span aria-hidden="true">%</span><span data-i18n="nav.taxes">Налоги</span></button>
      <button class="nav-item" data-view="contacts"><span aria-hidden="true">◎</span><span data-i18n="nav.contacts">Контрагенты</span></button>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span data-i18n="storage.local">Локальная SQLite</span>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <h1 id="page-title">Обзор</h1>
        <p id="profile-name">Autónomo</p>
      </div>
      <div class="topbar-actions">
        <div class="locale-control" role="group" aria-label="Язык интерфейса" data-i18n-aria="locale.aria">
          <button type="button" data-locale="ru" aria-pressed="true" title="Русский">RU</button>
          <button type="button" data-locale="en" aria-pressed="false" title="English">EN</button>
        </div>
        <label class="period-control">
          <span data-i18n="toolbar.period">Период</span>
          <select id="period-select" aria-label="Налоговый период" data-i18n-aria="toolbar.periodAria"></select>
        </label>
        <button id="refresh-button" class="icon-button" title="Обновить расчет" aria-label="Обновить расчет" data-i18n-title="toolbar.refresh" data-i18n-aria="toolbar.refresh">↻</button>
        <button id="new-entry-button" class="primary-button"><span aria-hidden="true">+</span> <span data-i18n="common.add">Добавить</span></button>
      </div>
    </header>

    <section id="app" class="content" aria-live="polite">
      <div class="loading-state" data-i18n="common.loading">Загрузка данных…</div>
    </section>
  </main>

  <dialog id="intake-dialog" class="intake-dialog">
    <form id="intake-form" method="dialog">
      <header class="dialog-header">
        <div>
          <h2 data-i18n="intake.title">Новая запись</h2>
          <p id="intake-period-label"></p>
        </div>
        <button type="button" class="icon-button" id="close-dialog" aria-label="Закрыть" data-i18n-aria="common.close">×</button>
      </header>

      <div class="segmented-control" role="group" aria-label="Тип записи" data-i18n-aria="intake.kindAria">
        <button type="button" data-kind="expense_invoice" class="active" data-i18n="nav.expenses">Расходы</button>
        <button type="button" data-kind="income_invoice" data-i18n="nav.income">Доходы</button>
      </div>
      <input type="hidden" name="kind" id="intake-kind" value="expense_invoice">
      <input type="hidden" name="period" id="intake-period">

      <label class="file-drop" id="file-drop">
        <input type="file" name="file" id="intake-file" required accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.csv,.txt">
        <strong id="file-label">Выберите счет поставщика или перетащите файл</strong>
        <span data-i18n="intake.fileFormats">PDF, изображение, CSV или TXT до 30 MB</span>
      </label>

      <div class="form-grid">
        <label>
          <span data-i18n="fields.documentDate">Дата документа</span>
          <input type="date" name="issued_on" id="issued-on">
        </label>
        <label>
          <span id="counterparty-label" data-i18n="fields.supplier">Поставщик</span>
          <input type="text" name="counterparty_name" autocomplete="organization">
        </label>
        <label>
          <span data-i18n="fields.number">Номер</span>
          <input type="text" name="document_number">
        </label>
        <label>
          <span data-i18n="fields.currency">Валюта</span>
          <select name="currency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
          </select>
        </label>
        <label>
          <span data-i18n="fields.total">Итого</span>
          <input type="number" name="gross" min="0" step="0.01" inputmode="decimal">
        </label>
        <label class="expense-only">
          <span data-i18n="fields.vatBase">База IVA</span>
          <input type="number" name="taxable_base" min="0" step="0.01" inputmode="decimal">
        </label>
        <label class="expense-only">
          <span>IVA</span>
          <input type="number" name="vat" min="0" step="0.01" inputmode="decimal">
        </label>
      </div>

      <footer class="dialog-actions">
        <span id="intake-status"></span>
        <button type="button" class="secondary-button" id="cancel-dialog" data-i18n="common.cancel">Отмена</button>
        <button type="submit" class="primary-button" id="submit-intake" data-i18n="intake.accept">Принять в систему</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
