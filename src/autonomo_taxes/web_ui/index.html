<!DOCTYPE html><html lang="ru"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title"></title>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>
        <strong>Autónomo</strong>
        <small data-i18n="brand.subtitle"></small>
      </span>
    </div>

    <nav class="primary-nav" data-i18n-aria="nav.aria">
      <a class="nav-item active" href="/dashboard" data-view="dashboard" data-spa=""><span aria-hidden="true">▦</span><span data-i18n="nav.dashboard"></span></a>
      <a class="nav-item" href="/income" data-view="income" data-spa=""><span aria-hidden="true">↗</span><span data-i18n="nav.income"></span></a>
      <a class="nav-item" href="/expenses" data-view="expenses" data-spa=""><span aria-hidden="true">↙</span><span data-i18n="nav.expenses"></span></a>
      <a class="nav-item" href="/review" data-view="review" data-spa=""><span aria-hidden="true">✓</span><span data-i18n="nav.review"></span></a>
      <a class="nav-item" href="/assets" data-view="assets" data-spa=""><span aria-hidden="true">◇</span><span data-i18n="nav.assets"></span></a>
      <a class="nav-item" href="/taxes" data-view="taxes" data-spa=""><span aria-hidden="true">%</span><span data-i18n="nav.taxes"></span></a>
      <a class="nav-item" href="/contacts" data-view="contacts" data-spa=""><span aria-hidden="true">◎</span><span data-i18n="nav.contacts"></span></a>
      <a class="nav-item" href="/settings" data-view="settings" data-spa=""><span aria-hidden="true">⚙</span><span data-i18n="nav.settings"></span></a>
    </nav>

    <a class="sidebar-footer storage-settings-link" href="/settings" data-spa="">
      <span aria-hidden="true">⚙</span>
      <span data-i18n="storage.settings"></span>
    </a>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <h1 id="page-title" data-i18n="titles.dashboard"></h1>
        <p id="profile-name">Autónomo</p>
      </div>
      <div class="topbar-actions">
        <div class="locale-control" role="group" data-i18n-aria="locale.aria"></div>
        <label class="period-control">
          <span data-i18n="toolbar.period"></span>
          <select id="period-select" data-i18n-aria="toolbar.periodAria"></select>
        </label>
        <button id="refresh-button" class="icon-button" data-i18n-title="toolbar.refresh" data-i18n-aria="toolbar.refresh">↻</button>
        <button id="new-entry-button" class="primary-button"><span aria-hidden="true">+</span> <span data-i18n="common.add"></span></button>
      </div>
    </header>

    <section id="app" class="content" aria-busy="false">
      <div class="loading-state" data-i18n="common.loading"></div>
    </section>
  </main>

  <dialog id="intake-dialog" class="intake-dialog">
    <form id="intake-form" method="dialog">
      <header class="dialog-header">
        <div>
          <h2 data-i18n="intake.title"></h2>
          <p id="intake-period-label"></p>
        </div>
        <button type="button" class="icon-button" id="close-dialog" data-i18n-aria="common.close">×</button>
      </header>

      <div class="segmented-control" role="group" data-i18n-aria="intake.kindAria">
        <button type="button" data-kind="expense_invoice" class="active" data-i18n="nav.expenses"></button>
        <button type="button" data-kind="income_invoice" data-i18n="nav.income"></button>
      </div>
      <input type="hidden" name="kind" id="intake-kind" value="expense_invoice">
      <input type="hidden" name="period" id="intake-period">

      <fieldset class="segmented-control intake-source-control" id="intake-source-control" data-i18n-aria="intake.sourceAria">
        <button type="button" data-intake-source="upload" class="active" data-i18n="intake.sourceUpload"></button>
        <button type="button" data-intake-source="google_drive" data-i18n="intake.sourceGoogleDrive"></button>
      </fieldset>

      <label class="file-drop" id="file-drop">
        <input type="file" name="file" id="intake-file" required="" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.csv,.txt">
        <strong id="file-label" data-i18n="intake.expenseFile"></strong>
        <span data-i18n="intake.fileFormats"></span>
      </label>
      <div id="google-folder-controls" class="intake-folder-controls" hidden="">
        <button type="button" id="choose-google-folder" class="secondary-button" data-i18n="intake.chooseGoogleFolder"></button>
        <span id="google-folder-selection" aria-live="polite"></span>
      </div>

      <label id="google-drive-url-field" hidden="">
        <span data-i18n="intake.googleDriveUrl"></span>
        <input type="url" name="drive_url" id="google-drive-url" inputmode="url" autocomplete="url" data-i18n-placeholder="intake.googleDrivePlaceholder">
        <small data-i18n="intake.googleDriveHint"></small>
      </label>
      <p id="google-picker-hint" class="intake-notice" hidden="" data-i18n="intake.googlePickerHint"></p>

      <div class="form-grid">
        <label>
          <span data-i18n="fields.documentDate"></span>
          <input type="date" name="issued_on" id="issued-on">
        </label>
        <label>
          <span id="counterparty-label" data-i18n="fields.supplier"></span>
          <input type="text" name="counterparty_name" autocomplete="organization">
        </label>
        <label>
          <span data-i18n="fields.number"></span>
          <input type="text" name="document_number" aria-describedby="intake-notice">
        </label>
        <label>
          <span data-i18n="fields.currency"></span>
          <select name="currency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
          </select>
        </label>
        <label>
          <span data-i18n="fields.total"></span>
          <input type="number" name="gross" min="0" step="0.01" inputmode="decimal">
        </label>
        <label class="expense-only">
          <span data-i18n="fields.vatBase"></span>
          <input type="number" name="taxable_base" min="0" step="0.01" inputmode="decimal">
        </label>
        <label class="expense-only">
          <span>IVA</span>
          <input type="number" name="vat" min="0" step="0.01" inputmode="decimal">
        </label>
      </div>

      <p id="intake-consistency-hint" class="intake-notice" aria-live="polite" hidden=""></p>
      <div id="intake-notice" class="intake-notice" role="note" aria-live="polite" hidden=""></div>

      <footer class="dialog-actions">
        <span id="intake-status"></span>
        <button type="button" class="secondary-button" id="cancel-dialog" data-i18n="common.cancel"></button>
        <button type="submit" class="primary-button" id="submit-intake" data-i18n="intake.accept"></button>
      </footer>
    </form>
  </dialog>

  <dialog id="posting-confirm-dialog" class="intake-dialog posting-dialog">
    <form method="dialog">
      <header class="dialog-header">
        <div>
          <h2 data-i18n="review.postConfirmTitle"></h2>
          <p id="posting-confirm-period"></p>
        </div>
        <button type="button" class="icon-button" id="close-posting-dialog" data-i18n-aria="common.close">×</button>
      </header>

      <div id="posting-confirm-body" class="dialog-body"></div>

      <footer class="dialog-actions">
        <span id="posting-confirm-status"></span>
        <button type="button" class="secondary-button" id="cancel-posting-dialog" data-i18n="common.cancel"></button>
        <button type="button" class="primary-button" id="confirm-posting-button" data-i18n="review.postConfirmAction"></button>
      </footer>
    </form>
  </dialog>

  <div id="counterparty-actions-menu" class="counterparty-actions-menu" role="menu" data-i18n-aria="contacts.actions" hidden="">
    <button type="button" role="menuitem" id="counterparty-menu-rename" data-i18n="contacts.editName"></button>
  </div>
  <dialog id="counterparty-name-dialog" class="intake-dialog counterparty-name-dialog" aria-labelledby="counterparty-name-title">
    <form id="counterparty-name-form" novalidate="">
      <header class="dialog-header">
        <h2 id="counterparty-name-title" data-i18n="contacts.editName"></h2>
        <button type="button" class="icon-button" id="close-counterparty-name" data-i18n-aria="common.close">×</button>
      </header>
      <p id="counterparty-name-hint" data-i18n="contacts.renameHint"></p>
      <div class="form-grid counterparty-name-fields">
        <label for="counterparty-name-input">
          <span data-i18n="contacts.nameLabel"></span>
          <input id="counterparty-name-input" type="text" required="" aria-describedby="counterparty-name-hint counterparty-name-error">
        </label>
      </div>
      <p id="counterparty-name-error" class="counterparty-name-error" role="alert"></p>
      <div id="counterparty-name-conflict" class="counterparty-name-conflict" hidden="">
        <p id="counterparty-current-name"></p>
        <button type="button" id="accept-counterparty-current-name" class="secondary-button" data-i18n="contacts.acceptCurrentName"></button>
      </div>
      <details id="counterparty-name-history">
        <summary data-i18n="contacts.nameHistory"></summary>
        <div id="counterparty-name-history-body" aria-live="polite"></div>
        <button type="button" id="retry-counterparty-name-history" class="secondary-button" data-i18n="contacts.retryHistory" hidden=""></button>
      </details>
      <footer class="dialog-actions">
        <button type="button" class="secondary-button" id="cancel-counterparty-name" data-i18n="common.cancel"></button>
        <button type="submit" class="primary-button" id="save-counterparty-name" data-i18n="contacts.saveName"></button>
      </footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"><span id="toast-message"></span><button type="button" id="toast-close" class="toast-close" data-i18n-aria="common.close">×</button></div>
  <dialog id="status-help-dialog" class="status-help-dialog" aria-labelledby="status-help-title">
    <header><h2 id="status-help-title"></h2><button type="button" id="status-help-close" data-i18n-aria="help.words.close">×</button></header>
    <div id="status-help-body"></div>
  </dialog>
  <dialog id="chart-dialog" class="intake-dialog chart-dialog" aria-labelledby="chart-dialog-title">
    <header class="dialog-header">
      <h2 id="chart-dialog-title"></h2>
      <button type="button" class="icon-button" id="chart-dialog-close" data-i18n-aria="common.close">×</button>
    </header>
    <div class="chart-dialog-body" id="chart-dialog-slot"></div>
  </dialog>
  <div id="accounting-tooltip" class="accounting-tooltip" role="tooltip" hidden=""></div>
  <script type="module" src="../../../frontend/src/main.ts"></script>


</body></html>
