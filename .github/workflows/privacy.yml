name: Privacy guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked content and reachable history
        run: python scripts/privacy_guard.py --history
