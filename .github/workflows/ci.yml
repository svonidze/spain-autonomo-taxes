name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'
      - run: python -m pip install --disable-pip-version-check pytest build
      - run: npm --prefix frontend ci --include=dev --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: python -m pip install --disable-pip-version-check -e ./backend
      - run: npm --prefix frontend run check:runtime
      - run: npm --prefix frontend run test:coverage-map
      - run: npm --prefix frontend run test:chart-module
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:pseudo
      - run: npm --prefix frontend run test:browser
      - run: npm --prefix frontend run test:installed
      - run: python -m pytest -q
      - name: Validate operational shell scripts
        run: |
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
