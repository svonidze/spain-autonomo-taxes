name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: python -m pip install --disable-pip-version-check pytest build
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check -e .
      - run: npm run check:runtime
      - run: npm run test:coverage-map
      - run: npm run test:legacy
      - run: npm run test:chart-module
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pseudo
      - run: npm run test:browser
      - run: npm run test:installed
      - run: python -m pytest -q
      - name: Validate operational shell scripts
        run: |
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
