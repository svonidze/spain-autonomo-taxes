name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e . pytest
      - run: python -m pytest -q
      - name: Validate operational shell scripts
        run: |
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
